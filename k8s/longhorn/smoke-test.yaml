apiVersion: v1
kind: Namespace
metadata:
  name: longhorn-test
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: longhorn-smoke-pvc
  namespace: longhorn-test
spec:
  storageClassName: longhorn-prod
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: longhorn-smoke
  namespace: longhorn-test
spec:
  restartPolicy: Always
  containers:
    - name: tester
      image: busybox:1.36.1
      command: ["/bin/sh", "-c", "while true; do sleep 3600; done"]
      volumeMounts:
        - name: data
          mountPath: /data
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: longhorn-smoke-pvc
